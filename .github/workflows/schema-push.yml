name: Push Schema to Neon

on:
  workflow_dispatch:

jobs:
  schema-push:
    name: Prisma DB Push
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to database
        run: |
          echo "Testing database connection..."
          npx prisma db push --accept-data-loss 2>&1
          echo "Schema push complete. Verifying..."
          npx prisma db pull 2>&1 | grep -i "keyword" || echo "WARNING: keywords column not found after push"
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          DATABASE_URL: ${{ secrets.POSTGRES_PRISMA_URL }}

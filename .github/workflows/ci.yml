name: CI

on:
  pull_request:
    branches: [main, feat/job-library]
  push:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          # Prisma needs a connection string at build time for type generation
          # but doesn't actually connect during build
          POSTGRES_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx vitest run
        env:
          POSTGRES_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

  health-check:
    name: Health Check (Post-Deploy)
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5

    # NOTE: Vercel deploys on push regardless of CI status. This health-check
    # job gates on both lint-and-build AND test, so it only runs when the full
    # suite is green. However, it cannot prevent Vercel from deploying a broken
    # build. For true deployment gating, enable Vercel's "Required Checks"
    # feature in the project settings to block promotion until CI passes.

    steps:
      - name: Wait for Vercel deployment
        run: sleep 60

      - name: Check deployment health
        run: |
          HEALTH_URL="${{ vars.VERCEL_URL }}/api/health"
          if [ -z "${{ vars.VERCEL_URL }}" ]; then
            echo "VERCEL_URL not configured in repository variables — skipping health check"
            exit 0
          fi
          echo "Checking: $HEALTH_URL"
          RESPONSE=$(curl -sf "$HEALTH_URL" || echo "FAILED")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
            echo "Deployment is healthy!"
          else
            echo "WARNING: Health check returned unexpected response"
            exit 1
          fi
